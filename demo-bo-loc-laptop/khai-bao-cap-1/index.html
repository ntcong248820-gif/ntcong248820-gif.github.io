const $ = (s, r) => (r || document).querySelector(s), $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
$('#b-2cap').href = CFG.demo2;

/* ---------- 2 cột: phóng bảng Lọc vừa bề ngang cột, chuyển lệnh chọn giữa 2 cột ---------- */
const frames = $$('.col iframe');
let notesOn = true;
const send = (f, m) => f.contentWindow && f.contentWindow.postMessage(Object.assign({ tb: 1 }, m), '*');
const rong = new Map(), popw = new Map();
function layout() {
  for (const f of frames) {
    const box = f.parentElement, w = box.clientWidth, h = box.clientHeight;
    if (!w) continue;
    const pw = Math.round(Math.min(720, Math.max(440, w / 0.85 - 40)) / 20) * 20;
    if (popw.get(f) !== pw) { popw.set(f, pw); send(f, { type: 'pop', w: pw }); }
    const W0 = rong.get(f) || pw + 40, s = Math.min(w / W0, 1.3);
    f.style.width = W0 + 'px';
    f.style.left = Math.max(0, (w - W0 * s) / 2) + 'px';
    f.style.transform = `scale(${s})`;
    f.style.height = Math.ceil(h / s) + 'px';
    send(f, { type: 'k', k: Math.min(2.6, Math.max(1, 1 / s)).toFixed(3) });
  }
}
addEventListener('resize', layout);
addEventListener('message', e => {
  const m = e.data; if (!m || !m.tb) return;
  const src = frames.find(f => f.contentWindow === e.source); if (!src) return;
  if (m.type === 'san-sang') { popw.delete(src); layout(); send(src, { type: 'ghi-chu', on: notesOn }); return; }
  if (['chon', 'nhom', 'bo'].includes(m.type)) frames.forEach(f => send(f, m));
  else if (m.type === 'rong' && rong.get(src) !== m.w) { rong.set(src, m.w); layout(); }
});
for (const col of $$('.col')) {
  const b = col.dataset.ban, d = CFG.dem[b];
  col.querySelector('[data-dem]').innerHTML = `<span class="stat"><b>${d.bo_loc}</b>bộ lọc</span> <span class="stat"><b>${d.nut}</b>nút</span> <span class="stat">+ Thương hiệu</span>`;
  col.querySelector('iframe').src = CFG.cot[b];
}
$('#b-gc').addEventListener('click', e => {
  notesOn = !notesOn; e.currentTarget.setAttribute('aria-pressed', notesOn);
  frames.forEach(f => send(f, { type: 'ghi-chu', on: notesOn }));
});
requestAnimationFrame(layout);

/* ---------- bảng order ---------- */
const MAU = t => /^Đổi tên/.test(t) ? 'ten' : /gộp|Gộp/.test(t) ? 'gop' : /^Giá trị mới/.test(t) ? 'moi' : /^Chuyển/.test(t) ? 'cho'
  : /^Ẩn/.test(t) ? 'an' : /^Đổi thứ tự/.test(t) ? 'thu' : '';
const HIEN = ['Bộ lọc trên web mới', 'Thứ tự nút', 'Nút trên web mới', 'Giá trị trên web hiện tại', 'Đổi gì so với web', 'Việc khai báo', 'Tên khi IT xong 2 cấp', 'Địa chỉ trang', 'Số máy (web 16/11)'];
let loc = 'viec';
function veBang() {
  const nhom = { tat: 'Tất cả', viec: 'Chỉ dòng có việc' };
  const dem = {}; CFG.order.forEach(r => { dem[r['Đổi gì so với web']] = (dem[r['Đổi gì so với web']] || 0) + 1; });
  const soViec = CFG.order.filter(r => r['Đổi gì so với web'] !== 'Giữ' && !/^Giữ/.test(r['Đổi gì so với web'])).length;
  $('#dem').innerHTML = `<button data-l="viec" class="${loc === 'viec' ? 'on' : ''}">Có việc (${soViec})</button>` +
    `<button data-l="tat" class="${loc === 'tat' ? 'on' : ''}">Tất cả (${CFG.order.length})</button>` +
    Object.entries(dem).map(([k, v]) => `<button data-l="${esc(k)}" class="${loc === k ? 'on' : ''}">${esc(k)} (${v})</button>`).join('');
  $('#th').innerHTML = HIEN.map(c => `<th>${esc(c.replace('Bộ lọc trên web mới', 'Bộ lọc').replace('Thứ tự nút', 'Thứ tự'))}</th>`).join('');
  const rows = CFG.order.filter(r => loc === 'tat' ? true : loc === 'viec' ? !/^Giữ/.test(r['Đổi gì so với web']) : r['Đổi gì so với web'] === loc);
  let cu = '', out = '';
  for (const r of rows) {
    if (r['Bộ lọc trên web mới'] !== cu) {
      cu = r['Bộ lọc trên web mới'];
      const dw = CFG.nhom_dong[cu] || r['Dòng bộ lọc trên MDM'];
      out += `<tr class="nhom"><td colspan="${HIEN.length}">${esc(cu)}${dw !== cu ? ` <span style="font-weight:500;color:#6941c6">(trên MDM: ${esc(dw)})</span>` : ''}</td></tr>`;
    }
    out += '<tr>' + HIEN.map(c => {
      const v = r[c] ?? '';
      if (c === 'Đổi gì so với web') return `<td><span class="tag ${MAU(v)}">${esc(v)}</span></td>`;
      return `<td class="v">${esc(c === 'Bộ lọc trên web mới' ? '' : v)}</td>`;
    }).join('') + '</tr>';
  }
  $('#tb').innerHTML = out;
}
$('#dem').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { loc = b.dataset.l; veBang(); } });
$('#b-csv').addEventListener('click', () => {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const csv = '﻿' + [CFG.cols.map(q).join(','), ...CFG.order.map(r => CFG.cols.map(c => q(r[c])).join(','))].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'order-khai-bao-bo-loc-laptop-cap-1.csv'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
veBang();
</script>
