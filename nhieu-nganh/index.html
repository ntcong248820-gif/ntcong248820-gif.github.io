const fm = n => (n ?? 0).toLocaleString('vi-VN');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur = null, NUT = [];

function tabs(){
  document.getElementById('tabs').innerHTML = DATA.map(d =>
    `<button class="tab${cur && cur.slug===d.slug?' on':''}" onclick="chon('${d.slug}')">${esc(d.nganh)}<small>${fm(d.tom.moc)}</small></button>`).join('');
}
function chon(slug){
  cur = DATA.find(d => d.slug===slug) || DATA[0];
  if (location.hash.slice(1)!==cur.slug) history.replaceState(null,'','#'+cur.slug);
  tabs(); ve(); dong(); window.scrollTo(0,0);
}
function chip(n, cls, extra){
  const i = NUT.push(n)-1;
  const it = n.lt < cur.tom.moc ? ' it' : '';
  return `<button class="c ${cls||''}${n.moi?' moi':''}" onclick="xem(${i},this)"${extra||''}>${esc(n.ten)}<span class="v${it}">${fm(n.lt)}</span></button>`;
}
function nhom(n, key){
  const i = NUT.push(n)-1;
  const cls = n.khac ? 'khac' : 'cum';
  const kids = (n.con||[]).map(k => k.con ? nhom(k, key+'-'+i) : chip(k)).join('');
  return `<button class="c ${cls}" onclick="mo('${key}-${i}',${i},this)">${esc(n.ten)}<span class="v">${fm(n.lt)}</span><span class="ar">▾</span></button>`
    + `<div class="khung" id="k-${key}-${i}" style="flex-basis:100%"><div class="kt">${n.khac?'Các giá trị chưa hiện riêng':'Bấm cụm là lọc cả cụm; chọn thêm 1 giá trị bên dưới'}</div><div class="chips">${kids}</div></div>`;
}
function cotHienTai(d){
  const bl = d.hien_tai;
  const nut = bl.reduce((s,b)=>s+b.nut.length,0);
  return `<div class="col"><div class="ch"><h2>Hiện tại trên web</h2><span class="stat"><b>${bl.length}</b>bộ lọc</span><span class="stat"><b>${nut}</b>giá trị</span></div>`
   + bl.map(b => `<div class="bl"><div class="bh"><span class="t">${esc(b.ten)}</span>${b.lt!=null?`<span class="l">${fm(b.lt)} lượt tìm</span>`:''}</div>
     <div class="chips">${b.nut.map(n=>chip({...n, ly:'Giá trị đang có trên web'})).join('')}</div></div>`).join('')
   + `</div>`;
}
function cotMoi(d){
  const hien = d.bo_loc.filter(b=>b.hien), an = d.bo_loc.filter(b=>!b.hien && b.nut.length);
  let man = 0; hien.forEach(b => man += b.nut.length);
  const h = hien.map((b,bi) => `<div class="bl"><div class="bh"><span class="t">${esc(b.ten)}</span>${b.trang_thai==='Thuộc tính mới'?'<span class="tagm">Thuộc tính mới</span>':''}<span class="l">${fm(b.lt)} lượt tìm${b.gom?' · gom theo cụm':''}</span></div>
     <div class="chips">${b.nut.map(n => n.con ? nhom(n,'b'+bi) : chip(n)).join('')}</div></div>`).join('');
  const a = an.length ? `<div class="bl an-bl"><div class="bh"><span class="t">Không hiện (dưới VLS chuẩn ${fm(d.tom.moc)})</span></div><div class="chips">${an.map(b=>chip({ten:b.ten, lt:b.lt, ly:b.ly}, 'an')).join('')}</div></div>` : '';
  return `<div class="col"><div class="ch"><h2>Sau khi áp luật Quy_Trình</h2><span class="stat"><b>${hien.length}</b>bộ lọc</span><span class="stat"><b>${man}</b>nút màn hình đầu</span></div>${h}${a}</div>`;
}
function bangTT(d){
  const rows = d.bang.slice().sort((a,b)=> (a['Kết quả']==='Kéo ra'?0:1)-(b['Kết quả']==='Kéo ra'?0:1) || b['Lượt tìm/tháng']-a['Lượt tìm/tháng']);
  return `<div class="sec"><h3>Bảng thuộc tính sau khi áp công thức</h3><table><thead><tr><th>Nhóm thông số</th><th>Thuộc tính</th><th>Đang có trên web</th><th class="so">Lượt tìm/tháng</th><th>Kết quả</th><th>Lý do</th><th>Nếu giữ cứng 200</th></tr></thead><tbody>`
   + rows.map(r => `<tr class="${r['Kết quả']==='Kéo ra'?'':'ko'}"><td>${esc(r['Nhóm thông số'])}</td><td>${esc(r['Thuộc tính'])}</td><td>${esc(r['Đang có trên web'])}</td><td class="so">${fm(r['Lượt tìm/tháng'])}</td><td class="kq ${r['Kết quả']==='Kéo ra'?'ok':'no'}">${esc(r['Kết quả'])}</td><td>${esc(r['Lý do'])}</td><td>${esc(r['Nếu giữ cứng 200'])}</td></tr>`).join('')
   + `</tbody></table></div>`;
}
function ve(){
  NUT = [];
  const d = cur, t = d.tom;
  const pct = t.tong_nen ? (t.duoi_moc_luot/t.tong_nen*100).toFixed(1).replace('.',',') : '0';
  const hien = d.bo_loc.filter(b=>b.hien).length;
  document.getElementById('app').innerHTML = `
  <div class="ct">
   <div class="box chinh"><div class="n">VLS chuẩn của ${esc(d.nganh)}</div><div class="big">${fm(t.moc)}<small>lượt tìm/tháng</small></div>
    <div class="f">= ${fm(t.tong_nen)} ÷ ${t.so_gia_tri_nen} giá trị ÷ 10 = ${String(t.moc_tho).replace('.',',')}, bỏ số lẻ</div>

    <div class="f" style="margin-top:6px"><b>${hien}</b> thuộc tính được kéo ra bộ lọc.</div></div>
   <div class="box"><div class="n">Luật Quy_Trình (15/11)</div><ul>
    <li>Thuộc tính hiện khi lượt tìm ≥ VLS chuẩn, xếp lượt tìm giảm dần</li>

    <li>Từ 4 giá trị trở xuống: hiện hết. Từ 5: hiện giá trị đạt chuẩn, chưa đủ 3 thì hiện 3 giá trị cao nhất</li>
    <li>Còn lại từ 2 giá trị: vào "Khác ▾"; chỉ 1 thì hiện luôn. Không xét số sản phẩm</li></ul></div>
  </div>
  <div class="lg"><span><span class="sw"></span>Giá trị đang có trên web</span><span><span class="sw moi"></span>Giá trị mới (web chưa có, đạt VLS chuẩn)</span><span><span class="sw tim"></span>Cụm / Khác: bấm mở</span><span><span class="sw an"></span>Không hiện</span><span>Số trên nút: lượt tìm/tháng, cam là dưới VLS chuẩn</span></div>
  ${d.ghi_chu?`<p class="mute" style="margin:0 0 8px">${esc(d.ghi_chu)}</p>`:''}
  <div class="cols">${cotHienTai(d)}${cotMoi(d)}</div>
  ${bangTT(d)}`;   // 16/11 owner bỏ khối "Dữ liệu được lọc thế nào" cho gọn
}
function mo(key,i,el){ const k=document.getElementById('k-'+key); k.classList.toggle('open'); xem(i,el); }
function xem(i,el){
  const n = NUT[i];
  document.querySelectorAll('.c.sel').forEach(x=>x.classList.remove('sel')); el.classList.add('sel');
  const tk = (n.tk||[]).length ? `<p><b>Từ khoá tìm nhiều nhất:</b> ${n.tk.map(esc).join(', ')}</p>` : '';
  const con = n.con ? `<p><b>Gồm:</b> ${n.con.map(c=>esc(c.ten)+' ('+fm(c.lt)+')').join(', ')}</p>` : '';
  document.getElementById('drb').innerHTML = `<h4>${esc(n.ten)}</h4><p><b>${fm(n.lt)}</b> lượt tìm/tháng${n.web?' · đang có trên web':''}${n.moi?' · web chưa có':''}</p><p>${esc(n.ly||'')}</p>${con}${tk}`;
  document.getElementById('dr').classList.add('open');
}
function dong(){ document.getElementById('dr').classList.remove('open'); }
window.addEventListener('hashchange', () => chon(location.hash.slice(1)));
chon(location.hash.slice(1));
